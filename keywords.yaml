# 서비스기획자 / PM 직무 JD에 자주 등장하는 역량 사전.
#
#  id      : 내부 식별자 (profile.yaml 에서 이 id 또는 아래 aliases 중 아무 단어로 적어도 인식됩니다)
#  label   : 알림 메일에 표시될 이름
#  weight  : 그 역량이 JD에 등장했을 때의 중요도(기본 1.0). 높을수록 점수에 크게 반영됩니다.
#  aliases : JD 본문에서 이 역량으로 인식할 표기들 (대소문자/공백 무시, 부분일치)

