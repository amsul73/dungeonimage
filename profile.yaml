# ============================================================================
#  내 프로필 + 검색 조건  ―  이 파일만 고치면 알림 기준이 바뀝니다.
#  (이력서/포트폴리오를 아직 받지 못해 "신입 서비스기획자/PM" 기준 초안으로 채워뒀습니다.
#   have / highlights 를 본인 실제 경험으로 꼭 수정하세요. 수정 후 `python main.py profile` 로 확인)
# ============================================================================

me:
  name: "지원자"
  target_role: "서비스 기획자 / PM (신입)"

# ── 1. 내가 가진 역량 ────────────────────────────────────────────────────────
#  keywords.yaml 의 id 또는 그 안의 표기(예: "피그마", "SQL")를 그대로 써도 됩니다.
#  level 1~5 : 1=들어본 수준, 2=학습/과제 경험, 3=프로젝트에서 직접 사용,
#              4=반복 경험으로 익숙, 5=남에게 가르칠 수 있음
#  level 3 이상이어야 "충족"으로 100% 반영되고, 1~2 는 부분 점수만 받습니다.
have:
  requirement_spec: 3
  wireframe: 3
  figma: 3
  ia: 3
  policy_doc: 2
  prd: 2
  user_research: 3
  usability_test: 2
  persona: 3
  ux_ui: 3
  metrics: 2
  data_driven: 2
  sql: 2
  ga: 2
  ab_test: 1
  agile: 2
  jira: 2
  notion: 3
  dev_collab: 3
  project_mgmt: 3
  web_service: 3
  app_service: 2
  api_understanding: 1
  portfolio: 3
  side_project: 3

# ── 2. 포트폴리오 하이라이트 (알림 메일에 "이 공고엔 이 경험을 쓰세요"로 같이 표시) ──
#  keywords: 이 프로젝트로 어필 가능한 역량 id 들
highlights:
  - title: "졸업작품/사이드 프로젝트 - 웹 서비스 기획"
    summary: "요구사항 정의부터 화면설계서까지 단독 기획, 개발 2명과 8주 협업"
    keywords: [requirement_spec, wireframe, figma, dev_collab, web_service, side_project]
  - title: "사용자 리서치 과제"
    summary: "타깃 유저 10명 심층 인터뷰 → 퍼소나/고객여정 도출 → 개선안 제안"
    keywords: [user_research, persona, usability_test, ux_ui]
  - title: "데이터 분석 스터디/부트캠프"
    summary: "GA 데모 계정 퍼널 분석, SQL 기초 쿼리로 리텐션 지표 산출"
    keywords: [sql, ga, metrics, data_driven]

# ── 3. 공고 검색 조건 (수집 단계에서 걸러냄) ──────────────────────────────────
search:
  # 원티드 직무 태그 id. 기본값 = 서비스 기획자/PM·PO/전략기획 계열
  #  10110 서비스 기획자 / 10231 PM·PO / 10230 사업개발·기획 / 10229 전략기획
  wanted_tag_ids: [10110, 10231]
  locations: ["seoul"]          # 서울만
  years: 0                      # 0 = 신입
  limit_per_page: 50
  max_pages: 4                  # 한 번 실행에 최대 200건 훑기
  fetch_detail_limit: 80        # 상세 조회(=점수 계산) 상한. API 과호출 방지용

# ── 4. 하드 필터 (조건 안 맞으면 점수 계산 없이 제외) ────────────────────────
filters:
  require_seoul: true
  # 근무지 문자열에 아래 중 하나가 있으면 서울로 인정
  seoul_tokens: ["서울", "seoul", "강남", "성수", "판교역"]   # 판교는 제외하고 싶으면 "판교역" 삭제
  max_required_years: 1         # "경력 2년 이상" 같은 문구가 있으면 제외 (신입 지원 가능 공고만)
  allow_experience_unknown: true
  # 공고 제목에 아래 단어가 있으면 제외 (기획 직무가 아닌 공고 방어)
  exclude_title_keywords:
    ["개발자", "엔지니어", "developer", "engineer", "디자이너", "designer",
     "마케터", "영업", "세일즈", "회계", "인사담당", "리드", "lead",
     "팀장", "헤드", "head", "시니어", "senior", "총괄"]
  # 공고 제목에 아래 단어가 하나라도 있으면 가점 (직무 적합도)
  target_title_keywords:
    ["서비스 기획", "서비스기획", "프로덕트 기획", "기획자", "pm", "po",
     "product manager", "product owner", "프로덕트 매니저", "신입", "주니어", "junior"]

# ── 5. 점수 계산 방식 ───────────────────────────────────────────────────────
scoring:
  requirement_weight: 0.65      # 자격요건 충족도 비중
  preferred_weight: 0.35        # 우대사항 충족도 비중
  title_bonus: 8                # 제목이 타깃 직무와 맞으면 +8점 (최대 100점)
  newcomer_bonus: 5             # 공고에 "신입/주니어" 명시 시 +5점
  unknown_section_score: 0.5    # 자격요건/우대사항을 못 찾았을 때의 중립값
  partial_level_factor:         # 보유 레벨별 반영률
    1: 0.4
    2: 0.7
    3: 1.0
    4: 1.0
    5: 1.0

# ── 6. 알림 기준 ───────────────────────────────────────────────────────────
notify:
  threshold: 65                 # 이 점수 이상이면 알림 (0~100)
  max_jobs_per_mail: 10         # 한 통에 담을 최대 공고 수 (점수 높은 순)
  subject_prefix: "[기획 공고 알림]"
